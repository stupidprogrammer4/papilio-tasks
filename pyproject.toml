[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "papilio-tasks"
version = "0.1.0a0"
description = "Scheduling, projection and event tools in the Papilio family"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [{name = "Pouya", email = "captainjoker757@gmail.com"}]
dependencies = []

[project.scripts]
papilio_tasks = "papilio_tasks.cli.main:main"

[project.optional-dependencies]
scheduler = ["taskiq>=0.12.6,<0.13", "dishka>=1.10.1,<2"]
scheduler-rabbit = ["papilio-tasks[scheduler]", "taskiq-aio-pika>=0.6,<0.7"]
scheduler-redis = ["papilio-tasks[scheduler]", "taskiq-redis>=1.2.3,<1.3"]
projection = ["taskiq>=0.12.6,<0.13", "dishka>=1.10.1,<2"]
projection-rabbit = ["papilio-tasks[projection]", "taskiq-aio-pika>=0.6,<0.7"]
projection-redis = ["papilio-tasks[projection]", "taskiq-redis>=1.2.3,<1.3"]
events = ["faststream[cli]>=0.7.5,<0.8", "dishka-faststream>=0.7,<0.8"]
events-rabbit = ["papilio-tasks[events]", "faststream[rabbit]>=0.7.5,<0.8"]
events-kafka = ["papilio-tasks[events]", "faststream[kafka]>=0.7.5,<0.8"]
events-redis = ["papilio-tasks[events]", "faststream[redis]>=0.7.5,<0.8"]
dev = ["pytest>=9,<10", "pytest-asyncio>=1.3,<2", "ruff", "pyright==1.1.390"]

[tool.hatch.build.targets.wheel]
packages = ["papilio_tasks"]

[tool.hatch.build.targets.sdist]
include = ["papilio_tasks", "README.md", "LICENSE", "pyproject.toml"]

[tool.ruff]
line-length = 79
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pyright]
include = ["papilio_tasks"]
pythonVersion = "3.13"
typeCheckingMode = "basic"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
