name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      TEST_REDIS_URL: redis://127.0.0.1:6379/0
      TEST_RABBIT_URL: amqp://papilio:papilio-test@127.0.0.1:5672/
      TEST_KAFKA_URL: 127.0.0.1:9092
      TEST_NATS_URL: nats://127.0.0.1:4222
    services:
      redis:
        image: redis:8.0.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      rabbit:
        image: rabbitmq:4.3.4-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: papilio
          RABBITMQ_DEFAULT_PASS: papilio-test
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q check_running"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 20
      kafka:
        image: apache/kafka:4.3.1
        env:
          KAFKA_NODE_ID: "1"
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:9092
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
          KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
        ports:
          - 9092:9092
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install test and build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install '.[dev,scheduler-rabbit,scheduler-redis,projection-rabbit,projection-redis,events-rabbit,events-kafka,events-redis,events-nats]' hatchling
          python -m pip check
      - name: Check style and types
        run: |
          ruff check papilio_tasks tests
          ruff format --check papilio_tasks tests
          pyright
      - name: Start NATS with JetStream
        run: |
          docker run --detach --name papilio-ci-nats \
            --publish 127.0.0.1:4222:4222 \
            --publish 127.0.0.1:8222:8222 \
            nats:2.12-alpine --jetstream --http_port 8222
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8222/healthz; then
              exit 0
            fi
            sleep 1
          done
          docker logs papilio-ci-nats
          exit 1
      - name: Run all tests
        run: python -m pytest -p pytest_asyncio.plugin -q -rs --junitxml=test-results.xml
      - name: Require all integration tests to run
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          suites = list(ET.parse("test-results.xml").getroot().iter("testsuite"))
          assert suites, "No test suites reported"
          skipped = sum(int(suite.get("skipped", "0")) for suite in suites)
          assert skipped == 0, f"CI requires all backends: {skipped} tests skipped"
          PY
      - name: Build distributions
        run: python -m hatchling build
      - name: Collect service diagnostics
        if: always()
        env:
          REDIS_CONTAINER: ${{ job.services.redis.id }}
          RABBIT_CONTAINER: ${{ job.services.rabbit.id }}
          KAFKA_CONTAINER: ${{ job.services.kafka.id }}
        run: |
          mkdir -p ci-logs
          python -m pip freeze > ci-logs/dependencies.txt
          docker logs "$REDIS_CONTAINER" > ci-logs/redis.log 2>&1 || true
          docker logs "$RABBIT_CONTAINER" > ci-logs/rabbit.log 2>&1 || true
          docker logs "$KAFKA_CONTAINER" > ci-logs/kafka.log 2>&1 || true
          docker logs papilio-ci-nats > ci-logs/nats.log 2>&1 || true
      - name: Save test report and diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results-${{ matrix.python-version }}
          path: |
            test-results.xml
            ci-logs/
          retention-days: 7
      - name: Stop NATS
        if: always()
        run: docker rm --force --volumes papilio-ci-nats || true
